[package]
name = "wpp-wasm-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
wasm-encoder = "0.24.1" # ✅ Always include

# ❗ Only needed for WASM builds — conditionally compile
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(not(target_os = "freebsd"))'.dependencies.web-sys]
version = "0.3"
features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "Document", "Window"]
